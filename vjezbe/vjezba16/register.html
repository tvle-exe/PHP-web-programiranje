<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
    <style>
        body { font-family: Arial; background: #f4f4f4; }
        .container { width: 400px; margin: 40px auto; background: #fff; padding: 20px; }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; }
        button { background: #4CAF50; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>Registration Form</h2>

    <form action="save_user.php" method="POST">
        <input type="text" name="first_name" placeholder="First name" required>

        <input type="text" name="last_name" placeholder="Last name" required>

        <input type="email" name="email" placeholder="E-mail" required>

        <input type="text" name="username" placeholder="Username (5-10 chars)"
               minlength="5" maxlength="10" required>

        <input type="password" name="password" placeholder="Password (min 4 chars)"
               minlength="4" required>

        <select name="country" required>
            <option value="">Molimo odaberite</option>
            <option value="Hrvatska">Hrvatska</option>
            <option value="Srbija">Srbija</option>
            <option value="BiH">BiH</option>
            <option value="Slovenija">Slovenija</option>
        </select>

        <button type="submit">Submit</button>
    </form>
</div>

</body>
</html>
